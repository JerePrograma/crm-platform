services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestudio_crm}
      POSTGRES_USER: ${DATABASE_USER:-gestudio}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-gestudio_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-gestudio} -d ${POSTGRES_DB:-gestudio_crm}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - crm_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gestudio_crm}
      DATABASE_USER: ${DATABASE_USER:-gestudio}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-gestudio_local_only}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MIN_IDLE: ${DATABASE_MIN_IDLE:-1}
      CRM_BOOTSTRAP_USERNAME: ${CRM_BOOTSTRAP_USERNAME:-}
      CRM_BOOTSTRAP_PASSWORD: ${CRM_BOOTSTRAP_PASSWORD:-}
      SENDING_ENABLED: ${SENDING_ENABLED:-false}
      SENDING_DRY_RUN: ${SENDING_DRY_RUN:-true}
      SENDING_DAILY_LIMIT: ${SENDING_DAILY_LIMIT:-0}
      SENDING_KILL_SWITCH: ${SENDING_KILL_SWITCH:-true}
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  smoke:
    profiles: ["smoke"]
    image: curlimages/curl:8.10.1
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      CRM_BOOTSTRAP_USERNAME: ${CRM_BOOTSTRAP_USERNAME:-}
      CRM_BOOTSTRAP_PASSWORD: ${CRM_BOOTSTRAP_PASSWORD:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$$CRM_BOOTSTRAP_USERNAME"
        test -n "$$CRM_BOOTSTRAP_PASSWORD"
        curl --fail --silent http://backend:8080/actuator/health | grep -q '"status":"UP"'
        curl --fail --silent --user "$$CRM_BOOTSTRAP_USERNAME:$$CRM_BOOTSTRAP_PASSWORD" \
          "http://backend:8080/api/v1/prospects?size=1" | grep -q '"content"'
        curl --fail --silent http://frontend:8080/ | grep -qi '<div id="root"></div>'
        printf 'Container smoke test passed.\n'

volumes:
  crm_postgres:
