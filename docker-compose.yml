services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestudio_crm}
      POSTGRES_USER: ${DATABASE_USER:-gestudio}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-gestudio_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-gestudio} -d ${POSTGRES_DB:-gestudio_crm}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - crm_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gestudio_crm}
      DATABASE_USER: ${DATABASE_USER:-gestudio}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-gestudio_local_only}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MIN_IDLE: ${DATABASE_MIN_IDLE:-1}
      CRM_BOOTSTRAP_USERNAME: ${CRM_BOOTSTRAP_USERNAME:-}
      CRM_BOOTSTRAP_PASSWORD: ${CRM_BOOTSTRAP_PASSWORD:-}
      CRM_MINIMUM_PASSWORD_LENGTH: ${CRM_MINIMUM_PASSWORD_LENGTH:-12}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SENDING_ENABLED: ${SENDING_ENABLED:-false}
      SENDING_DRY_RUN: ${SENDING_DRY_RUN:-true}
      SENDING_DAILY_LIMIT: ${SENDING_DAILY_LIMIT:-0}
      SENDING_KILL_SWITCH: ${SENDING_KILL_SWITCH:-true}
      EMAIL_PROVIDER_MODE: ${EMAIL_PROVIDER_MODE:-NOOP}
      WHATSAPP_PROVIDER_MODE: ${WHATSAPP_PROVIDER_MODE:-DEEPLINK_ONLY}
      MESSAGING_REAL_NETWORK_ALLOWED: ${MESSAGING_REAL_NETWORK_ALLOWED:-false}
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  smoke:
    profiles: ["smoke"]
    image: curlimages/curl:8.10.1
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      CRM_BOOTSTRAP_USERNAME: ${CRM_BOOTSTRAP_USERNAME:-}
      CRM_BOOTSTRAP_PASSWORD: ${CRM_BOOTSTRAP_PASSWORD:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$$CRM_BOOTSTRAP_USERNAME"
        test -n "$$CRM_BOOTSTRAP_PASSWORD"
        curl --fail --silent http://backend:8080/actuator/health | grep -q '"status":"UP"'
        printf 'health: PASS\n'
        csrf_json=$$(curl --fail --silent --cookie-jar /tmp/cookies \
          http://backend:8080/api/v1/auth/csrf)
        csrf_token=$$(printf '%s' "$$csrf_json" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
        csrf_header=$$(printf '%s' "$$csrf_json" | sed -n 's/.*"headerName":"\([^"]*\)".*/\1/p')
        test -n "$$csrf_token"
        test -n "$$csrf_header"
        printf 'csrf: PASS\n'
        printf '{"username":"%s","password":"%s"}' \
          "$$CRM_BOOTSTRAP_USERNAME" "$$CRM_BOOTSTRAP_PASSWORD" > /tmp/login.json
        curl --fail --silent --show-error --cookie /tmp/cookies --cookie-jar /tmp/cookies \
          --header "$$csrf_header: $$csrf_token" --header 'Content-Type: application/json' \
          --data @/tmp/login.json http://backend:8080/api/v1/auth/login >/dev/null
        printf 'login: PASS\n'
        curl --fail --silent --cookie /tmp/cookies \
          "http://backend:8080/api/v1/prospects?size=1" | grep -q '"content"'
        printf 'api: PASS\n'
        curl --fail --silent http://frontend:8080/ | grep -qi '<div id="root"></div>'
        printf 'frontend: PASS\n'
        printf 'Container smoke test passed.\n'

volumes:
  crm_postgres:
