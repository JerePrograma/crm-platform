name: finalize-operator-ux
# retry 4: exercise progressive disclosure in the operator journey

on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-operator-ux.yml]

permissions:
  contents: write

concurrency:
  group: validate-operator-ux-e2e-main
  cancel-in-progress: true

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CRM_BOOTSTRAP_USERNAME: complete-admin
      CRM_BOOTSTRAP_PASSWORD: complete-admin-password
      SENDING_ENABLED: "false"
      SENDING_DRY_RUN: "true"
      SENDING_DAILY_LIMIT: "0"
      SENDING_KILL_SWITCH: "true"
      MESSAGING_REAL_NETWORK_ALLOWED: "false"
      EMAIL_PROVIDER_MODE: NOOP
      WHATSAPP_PROVIDER_MODE: DEEPLINK_ONLY
      FAKE_INBOUND_ENABLED: "true"
      FAKE_INBOUND_WEBHOOK_SECRET: synthetic-complete-crm-inbound-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Apply, validate and publish final UX changes
        shell: bash
        run: |
          set +e
          LOG=/tmp/finalize-operator-ux.log
          FAILED_STEP=''
          : > "$LOG"

          run_logged() {
            local name="$1"
            shift
            printf '\n### %s\n' "$name" | tee -a "$LOG"
            "$@" >>"$LOG" 2>&1
            local code=$?
            if [ "$code" -ne 0 ]; then
              FAILED_STEP="$name"
              printf 'FAILED (%s): %s\n' "$code" "$name" | tee -a "$LOG"
              return "$code"
            fi
            printf 'PASS: %s\n' "$name" | tee -a "$LOG"
          }

          code=0
          run_logged 'aplicación exacta del cierre UX' python .github/ux-transform-chunks/finalize-operator-ux.py
          code=$?
          if [ "$code" -eq 0 ]; then
            run_logged 'validación frontend' bash -lc 'cd frontend && npm ci --no-audit --no-fund && npm run typecheck && npm run test:unit && npm run build'
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            run_logged 'verificación backend completa' bash -lc 'FAKE_INBOUND_ENABLED=false ./mvnw -B -f backend/pom.xml verify'
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            run_logged 'instalación de navegador E2E' bash -lc 'cd frontend && npx playwright install --with-deps chromium'
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            run_logged 'inicio del stack fail-closed' docker compose --profile app up -d --build --wait
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            run_logged 'recorrido Playwright completo' bash -lc 'cd frontend && CRM_E2E_BASE_URL=http://127.0.0.1:5173 CRM_E2E_USERNAME=complete-admin CRM_E2E_PASSWORD=complete-admin-password CRM_E2E_BROWSER_CHANNEL=bundled CRM_E2E_INBOUND_SECRET=synthetic-complete-crm-inbound-secret npm run test:e2e'
            code=$?
          fi

          docker compose --profile app down -v --remove-orphans >>"$LOG" 2>&1 || true

          if [ "$code" -eq 0 ]; then
            run_logged 'seguridad y consistencia del diff' bash -lc "bash scripts/check-repository-safety.sh && git diff --check && ! grep -R --line-number --include='*.ts' --include='*.tsx' -E 'window\\.(prompt|confirm)' frontend/src && ! grep -nE 'Inbound y quarantine|No hay mensajes inbound|metadata sanitizada|Outbox por estado|Preview \\+ confirmación|Adaptador implementado, no conectado|Webhook fake|Score mínimo|borradores fake|Simular con fake|<option value=\"EMAIL\">Email</option>' frontend/src/App.tsx && git status --short && git diff --stat"
            code=$?
          fi

          git fetch origin main >>"$LOG" 2>&1
          fetch_code=$?
          if [ "$fetch_code" -ne 0 ]; then
            FAILED_STEP='sincronización final con origin/main'
            code=$fetch_code
          elif [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            FAILED_STEP='origin/main cambió durante la validación'
            printf 'Remote head changed from %s to %s\n' "$GITHUB_SHA" "$(git rev-parse origin/main)" >>"$LOG"
            code=99
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$code" -ne 0 ]; then
            if [ "$(git rev-parse origin/main 2>/dev/null)" = "$GITHUB_SHA" ]; then
              {
                echo 'Resultado: FALLÓ'
                echo "Etapa: ${FAILED_STEP:-desconocida}"
                echo "Commit base: ${GITHUB_SHA}"
                echo 'Salida final sanitizada:'
                tail -n 260 "$LOG"
              } > .github/operator-ux-final-result.txt
              git add .github/operator-ux-final-result.txt
              git commit -m 'ops: record final operator UX validation failure'
              git push origin HEAD:main
            fi
            exit "$code"
          fi

          mkdir -p docs/validation
          cat > docs/validation/UX-operator-overhaul-2026-07-23.md <<EOF
          # Validación de experiencia del operador — 2026-07-23

          ## Alcance validado

          - etiquetas visibles centralizadas en español;
          - navegación, formularios, tablas, estados vacíos, avisos y datos técnicos humanizados;
          - diálogos accesibles en reemplazo de \`window.prompt\` y \`window.confirm\`;
          - importaciones con vista previa, filtros, paginación y resolución guiada de duplicados;
          - creación independiente desde duplicados con conservación controlada de canales importados;
          - experiencia responsive y foco visible;
          - bloqueos de envío, simulación y ausencia de red real preservados.

          ## Validaciones ejecutadas

          - \`npm ci --no-audit --no-fund\`;
          - \`npm run typecheck\`;
          - \`npm run test:unit\`;
          - \`npm run build\`;
          - \`./mvnw -B -f backend/pom.xml verify\`;
          - Docker Compose con perfil \`app\` y configuración fail-closed;
          - \`npm run test:e2e\` con Playwright Chromium;
          - \`bash scripts/check-repository-safety.sh\`;
          - \`git diff --check\`;
          - comprobación de ausencia de diálogos nativos en \`frontend/src\`.

          ## Seguridad

          Durante la validación se mantuvieron \`SENDING_ENABLED=false\`, \`SENDING_DRY_RUN=true\`, límite diario cero, protección de emergencia activa y red real deshabilitada.

          Commit funcional base: \`96eaf921bbc5e3ef70854a3299c9b03f97a4b70e\`.
          Ejecución final: \`${GITHUB_RUN_ID}\` sobre \`${GITHUB_SHA}\`.
          EOF

          rm -f .github/operator-ux-final-result.txt .github/operator-ux-e2e-result.txt
          git add \
            frontend/src/App.tsx \
            frontend/src/uiLabels.ts \
            frontend/tests/complete-crm.spec.ts \
            docs/validation/UX-operator-overhaul-2026-07-23.md
          git rm -f --ignore-unmatch \
            .github/workflows/apply-operator-ux.yml \
            .github/workflows/validate-operator-ux-e2e.yml \
            .github/workflows/finalize-operator-ux.yml \
            .github/ux-transform-chunks/0.txt \
            .github/ux-transform-chunks/1.txt \
            .github/ux-transform-chunks/2.txt \
            .github/ux-transform-chunks/3.txt \
            .github/ux-transform-chunks/4.txt \
            .github/ux-transform-chunks/5.txt \
            .github/ux-transform-chunks/backend-independent.py \
            .github/ux-transform-chunks/finalize-operator-ux.py \
            .github/operator-ux-result.txt \
            .github/operator-ux-e2e-result.txt \
            .github/operator-ux-final-result.txt
          git diff --cached --check
          git commit -m 'feat: finalize Spanish operator UX and E2E coverage'
          git push origin HEAD:main
