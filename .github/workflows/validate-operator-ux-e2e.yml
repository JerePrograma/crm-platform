name: validate-operator-ux-e2e

on:
  push:
    branches: [main]
    paths: [.github/workflows/validate-operator-ux-e2e.yml]

permissions:
  contents: write

concurrency:
  group: validate-operator-ux-e2e-main
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CRM_BOOTSTRAP_USERNAME: complete-admin
      CRM_BOOTSTRAP_PASSWORD: complete-admin-password
      SENDING_ENABLED: "false"
      SENDING_DRY_RUN: "true"
      SENDING_DAILY_LIMIT: "0"
      SENDING_KILL_SWITCH: "true"
      MESSAGING_REAL_NETWORK_ALLOWED: "false"
      FAKE_INBOUND_ENABLED: "true"
      FAKE_INBOUND_WEBHOOK_SECRET: synthetic-complete-crm-inbound-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run canonical fail-closed E2E validation
        shell: bash
        run: |
          set +e
          LOG=/tmp/operator-ux-e2e.log
          : > "$LOG"
          (
            cd frontend
            npm ci --no-audit --no-fund
            npx playwright install --with-deps chromium
          ) >>"$LOG" 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            docker compose --profile app up -d --build --wait >>"$LOG" 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            (
              cd frontend
              CRM_E2E_BASE_URL=http://127.0.0.1:5173 \
              CRM_E2E_USERNAME=complete-admin \
              CRM_E2E_PASSWORD=complete-admin-password \
              CRM_E2E_BROWSER_CHANNEL=bundled \
              CRM_E2E_INBOUND_SECRET=synthetic-complete-crm-inbound-secret \
              npm run test:e2e
            ) >>"$LOG" 2>&1
            code=$?
          fi
          docker compose --profile app down -v --remove-orphans >>"$LOG" 2>&1 || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          {
            if [ "$code" -eq 0 ]; then
              echo 'Resultado: PASS'
            else
              echo 'Resultado: FALLÓ'
            fi
            echo "Commit validado: ${GITHUB_SHA}"
            echo 'Configuración: stack fail-closed, red real deshabilitada'
            echo 'Salida final sanitizada:'
            tail -n 180 "$LOG"
          } > .github/operator-ux-e2e-result.txt
          git add .github/operator-ux-e2e-result.txt
          git commit -m 'ops: record operator UX E2E validation'
          git push origin HEAD:main
          exit "$code"
