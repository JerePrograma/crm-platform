name: validate-resume-scripts-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-resume-scripts-once.yml"

permissions:
  contents: write

concurrency:
  group: validate-resume-scripts-once-main
  cancel-in-progress: false

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parse only changed PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'scripts/generate-frontend-lock.ps1',
            'scripts/resume-gestudio-master-preview.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path).Path,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $details = $errors | ForEach-Object { "${path}: $($_.Message)" }
              throw ($details -join [Environment]::NewLine)
            }
          }
      - name: Record syntax evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'scripts/generate-frontend-lock.ps1',
            'scripts/resume-gestudio-master-preview.ps1'
          )
          $lines = @("validated_commit=$env:GITHUB_SHA")
          foreach ($path in $paths) {
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $path"
          }
          $lines | Set-Content -LiteralPath '.github/resume-scripts-syntax-pass.txt' -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/resume-scripts-syntax-pass.txt
          git commit -m 'ops: record resume script syntax pass'
          git push origin HEAD:main
