name: format-import-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-import-once.yml"

permissions:
  contents: write

concurrency:
  group: format-import-once-main
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Apply repository formatter
        run: mvn -B -f backend/pom.xml spotless:apply
      - name: Verify exact formatting scope
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            'backend/src/main/java/com/gestudio/crm/imports/ProspectImportFileParser.java' \
            'backend/src/main/java/com/gestudio/crm/imports/ProspectImportService.java' \
            'backend/src/test/java/com/gestudio/crm/imports/ProspectImportServiceFileExclusionTest.java' | sort)"
          actual="$(git diff --name-only | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Unexpected formatter scope.' >&2
            echo 'Expected:' >&2
            printf '%s\n' "$expected" >&2
            echo 'Actual:' >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          git diff --check
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/src/main/java/com/gestudio/crm/imports/ProspectImportFileParser.java \
            backend/src/main/java/com/gestudio/crm/imports/ProspectImportService.java \
            backend/src/test/java/com/gestudio/crm/imports/ProspectImportServiceFileExclusionTest.java
          git commit -m 'style: apply Spotless to master import changes'
          git push origin HEAD:main
