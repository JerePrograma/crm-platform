name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-repository-safety.sh

  backend-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: ./mvnw -B -f backend/pom.xml -DskipTests spotless:check

  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: ./mvnw -B -f backend/pom.xml "-Dtest=**/*Test,!**/*IntegrationTest,!ArchitectureTest" test

  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: ./mvnw -B -f backend/pom.xml verify

  backend-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: ./mvnw -B -f backend/pom.xml -Dtest=ArchitectureTest test

  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: ./mvnw -B -f backend/pom.xml -Dtest=SecurityAuthorizationIntegrationTest test

  frontend-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: frontend

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund && npm run typecheck
        working-directory: frontend

  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund && npm run test:unit
        working-directory: frontend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start fail-closed stack
        env: &synthetic-env
          CRM_BOOTSTRAP_USERNAME: complete-admin
          CRM_BOOTSTRAP_PASSWORD: complete-admin-password
          SENDING_ENABLED: "false"
          SENDING_DRY_RUN: "true"
          SENDING_DAILY_LIMIT: "0"
          SENDING_KILL_SWITCH: "true"
          MESSAGING_REAL_NETWORK_ALLOWED: "false"
          FAKE_INBOUND_ENABLED: "true"
          FAKE_INBOUND_WEBHOOK_SECRET: synthetic-complete-crm-inbound-secret
        run: docker compose --profile app up -d --build --wait
      - run: npm run test:e2e
        working-directory: frontend
        env:
          CRM_E2E_BASE_URL: http://127.0.0.1:5173
          CRM_E2E_USERNAME: complete-admin
          CRM_E2E_PASSWORD: complete-admin-password
          CRM_E2E_BROWSER_CHANNEL: bundled
          CRM_E2E_INBOUND_SECRET: synthetic-complete-crm-inbound-secret
      - if: always()
        run: docker compose --profile app down -v --remove-orphans

  migration-from-empty:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull -t crm-platform-backend:ci .
      - run: bash scripts/verify-migrations.sh "$(docker compose images -q backend)"

  migration-from-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile app build backend
      - run: bash scripts/verify-migrations.sh "$(docker compose images -q backend)"

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: *synthetic-env
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile app --profile smoke up --build --abort-on-container-exit --exit-code-from smoke smoke
      - if: always()
        run: docker compose --profile app --profile smoke down -v --remove-orphans

  production-profile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-production-profile.sh 18080

  fake-messaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: ./mvnw -B -f backend/pom.xml -Dtest=MessagingIntegrationTest,ProviderContractTest test

  outbox-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: ./mvnw -B -f backend/pom.xml -Dtest=OutboxWorkerServiceTest,OutboxInboundIntegrationTest test

  inbound-webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: ./mvnw -B -f backend/pom.xml -Dtest=HmacWebhookSignatureVerifierTest,InboundMessageNormalizerTest,OutboxInboundIntegrationTest test

  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: *synthetic-env
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile app up -d --build --wait
      - run: bash scripts/verify-backup-restore.sh
      - if: always()
        run: docker compose --profile app down -v --remove-orphans

  scripts-windows-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./scripts/check-powershell-syntax.ps1

  scripts-unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: make -n repository-safety backend-verify-container validate-seg001 validate-complete-crm

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-fund && npm audit --audit-level=high
        working-directory: frontend
      - run: docker compose --profile app build backend
      - name: Scan backend runtime for high or critical vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/grype@sha256:fd4ab4d1042b522c896e73bdf09ab8bf384fa417df99d6dd0d6e1008c7e7c821 \
            crm-platform-backend:ci --fail-on high
