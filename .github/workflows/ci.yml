name: ci

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend
        run: sh ./mvnw -B -f backend/pom.xml verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Unix script syntax
        run: sh -n scripts/preflight.sh scripts/smoke-test.sh
      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/preflight.ps1',
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors -and $errors.Count -gt 0) { throw ($errors | Out-String) }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/smoke-test.ps1',
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors -and $errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Run fail-closed preflight
        run: |
          cp .env.example .env
          sed -i 's/^CRM_BOOTSTRAP_USERNAME=.*/CRM_BOOTSTRAP_USERNAME=ci-user/' .env
          sed -i 's/^CRM_BOOTSTRAP_PASSWORD=.*/CRM_BOOTSTRAP_PASSWORD=ci-local-only/' .env
          sh scripts/preflight.sh --local
          rm .env

  compose-images-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fail-closed CI environment
        run: |
          cp .env.example .env
          sed -i 's/^CRM_BOOTSTRAP_USERNAME=.*/CRM_BOOTSTRAP_USERNAME=ci-user/' .env
          sed -i 's/^CRM_BOOTSTRAP_PASSWORD=.*/CRM_BOOTSTRAP_PASSWORD=ci-local-only/' .env
      - name: Validate Docker Compose profiles
        run: docker compose --profile app --profile smoke config
      - name: Build backend image
        run: docker build -t gestudio-crm:${{ github.sha }} .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t gestudio-crm-frontend:${{ github.sha }} frontend
      - name: Run containerized smoke test
        run: >-
          docker compose --profile app --profile smoke up
          --build
          --abort-on-container-exit
          --exit-code-from smoke
          smoke
      - name: Print stack logs on failure
        if: failure()
        run: docker compose --profile app --profile smoke logs --no-color
      - name: Remove CI stack
        if: always()
        run: docker compose --profile app --profile smoke down -v --remove-orphans
