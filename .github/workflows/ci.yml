name: ci

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend
        run: sh ./mvnw -B -f backend/pom.xml verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Unix script syntax
        run: >-
          sh -n
          scripts/preflight.sh
          scripts/smoke-test.sh
          scripts/generate-frontend-lock.sh
          scripts/set-postgres-host-port.sh
          scripts/set-local-host-ports.sh
          scripts/verify-backend-container.sh
          scripts/check-repository-safety.sh
      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $scriptPaths = @(
            'scripts/preflight.ps1',
            'scripts/smoke-test.ps1',
            'scripts/generate-frontend-lock.ps1',
            'scripts/set-postgres-host-port.ps1',
            'scripts/set-local-host-ports.ps1',
            'scripts/validate-docker-stack.ps1',
            'scripts/verify-backend-container.ps1',
            'scripts/check-repository-safety.ps1',
            'scripts/validate-seg001.ps1'
          )
          foreach ($scriptPath in $scriptPaths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              throw "$scriptPath`n$($errors | Out-String)"
            }
          }
      - name: Check repository safety invariants
        run: sh scripts/check-repository-safety.sh
      - name: Run fail-closed preflight
        run: |
          cp .env.example .env
          sed -i 's/^CRM_BOOTSTRAP_USERNAME=.*/CRM_BOOTSTRAP_USERNAME=ci-user/' .env
          sed -i 's/^CRM_BOOTSTRAP_PASSWORD=.*/CRM_BOOTSTRAP_PASSWORD=ci-local-only/' .env
          sh scripts/set-local-host-ports.sh 55432 18080 15173
          sh scripts/preflight.sh --local
          rm .env

  compose-images-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fail-closed CI environment
        run: |
          cp .env.example .env
          sed -i 's/^CRM_BOOTSTRAP_USERNAME=.*/CRM_BOOTSTRAP_USERNAME=ci-user/' .env
          sed -i 's/^CRM_BOOTSTRAP_PASSWORD=.*/CRM_BOOTSTRAP_PASSWORD=ci-local-only/' .env
          sh scripts/set-local-host-ports.sh 55432 18080 15173
          sh scripts/preflight.sh --container-only
      - name: Validate Docker Compose profiles
        run: docker compose --profile app --profile smoke config
      - name: Build backend image
        run: docker build -t gestudio-crm:${{ github.sha }} .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t gestudio-crm-frontend:${{ github.sha }} frontend
      - name: Run containerized smoke test
        run: >-
          docker compose --profile app --profile smoke up
          --build
          --abort-on-container-exit
          --exit-code-from smoke
          smoke
      - name: Print stack logs on failure
        if: failure()
        run: docker compose --profile app --profile smoke logs --no-color
      - name: Remove CI stack
        if: always()
        run: docker compose --profile app --profile smoke down -v --remove-orphans
