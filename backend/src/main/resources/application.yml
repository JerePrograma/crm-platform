spring:
  application:
    name: gestudio-crm
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gestudio_crm}
    username: ${DATABASE_USER:gestudio}
    password: ${DATABASE_PASSWORD:gestudio_local_only}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:1}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

security:
  bootstrap:
    username: ${CRM_BOOTSTRAP_USERNAME:}
    password: ${CRM_BOOTSTRAP_PASSWORD:}

sending:
  enabled: ${SENDING_ENABLED:false}
  dry-run: ${SENDING_DRY_RUN:true}
  daily-limit: ${SENDING_DAILY_LIMIT:0}
  environment-kill-switch: ${SENDING_KILL_SWITCH:true}

logging:
  structured:
    format:
      console: logstash
