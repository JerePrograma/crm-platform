spring:
  application:
    name: gestudio-crm
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gestudio_crm}
    username: ${DATABASE_USER:gestudio}
    password: ${DATABASE_PASSWORD:gestudio_local_only}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:1}
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

security:
  bootstrap:
    username: ${CRM_BOOTSTRAP_USERNAME:}
    password: ${CRM_BOOTSTRAP_PASSWORD:}
    minimum-password-length: ${CRM_MINIMUM_PASSWORD_LENGTH:12}

sending:
  enabled: ${SENDING_ENABLED:false}
  dry-run: ${SENDING_DRY_RUN:true}
  daily-limit: ${SENDING_DAILY_LIMIT:0}
  environment-kill-switch: ${SENDING_KILL_SWITCH:true}

messaging:
  email-mode: ${EMAIL_PROVIDER_MODE:NOOP}
  whatsapp-mode: ${WHATSAPP_PROVIDER_MODE:DEEPLINK_ONLY}
  real-network-allowed: ${MESSAGING_REAL_NETWORK_ALLOWED:false}
  timeout: ${MESSAGING_HTTP_TIMEOUT:5s}
  gmail:
    base-url: ${GMAIL_API_BASE_URL:https://gmail.googleapis.com}
    access-token: ${GMAIL_ACCESS_TOKEN:}
    scopes: ${GMAIL_SCOPES:}
  whatsapp:
    base-url: ${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com}
    api-version: ${WHATSAPP_GRAPH_API_VERSION:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    business-account-id: ${WHATSAPP_BUSINESS_ACCOUNT_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    max-text-length: ${WHATSAPP_MAX_TEXT_LENGTH:4096}

crm:
  gmail:
    authorization-url: ${GMAIL_OAUTH_AUTHORIZATION_URL:https://accounts.google.com/o/oauth2/v2/auth}
    token-url: ${GMAIL_OAUTH_TOKEN_URL:https://oauth2.googleapis.com/token}
    userinfo-url: ${GMAIL_OAUTH_USERINFO_URL:https://www.googleapis.com/oauth2/v3/userinfo}
    revocation-url: ${GMAIL_OAUTH_REVOCATION_URL:https://oauth2.googleapis.com/revoke}
    api-base-url: ${GMAIL_API_BASE_URL:https://gmail.googleapis.com}
    client-id: ${GMAIL_OAUTH_CLIENT_ID:}
    client-secret: ${GMAIL_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GMAIL_OAUTH_REDIRECT_URI:}
    frontend-return-uri: ${GMAIL_FRONTEND_RETURN_URI:}
    scopes: ${GMAIL_OAUTH_SCOPES:openid email https://www.googleapis.com/auth/gmail.send}
    token-encryption-keys: ${GMAIL_TOKEN_ENCRYPTION_KEYS:}
    active-encryption-key-id: ${GMAIL_TOKEN_ENCRYPTION_ACTIVE_KEY_ID:}
    unsubscribe-public-base-url: ${GMAIL_UNSUBSCRIBE_PUBLIC_BASE_URL:}
    unsubscribe-signing-key: ${GMAIL_UNSUBSCRIBE_SIGNING_KEY:}
    unsubscribe-signing-key-id: ${GMAIL_UNSUBSCRIBE_SIGNING_KEY_ID:}
    state-ttl: ${GMAIL_OAUTH_STATE_TTL:10m}
    http-timeout: ${GMAIL_HTTP_TIMEOUT:10s}
    hard-daily-limit: ${GMAIL_HARD_DAILY_LIMIT:10}
    max-concurrency: ${GMAIL_MAX_CONCURRENCY:1}
    allow-test-endpoints: ${GMAIL_ALLOW_TEST_ENDPOINTS:false}
  outbox:
    enabled: ${OUTBOX_WORKER_ENABLED:false}
    batch-size: ${OUTBOX_WORKER_BATCH_SIZE:20}
    poll-delay: ${OUTBOX_WORKER_POLL_DELAY:5s}
    initial-delay: ${OUTBOX_WORKER_INITIAL_DELAY:5s}
    lease: ${OUTBOX_WORKER_LEASE:2m}
    base-backoff: ${OUTBOX_WORKER_BASE_BACKOFF:5s}
    max-backoff: ${OUTBOX_WORKER_MAX_BACKOFF:15m}
    default-max-attempts: ${OUTBOX_WORKER_MAX_ATTEMPTS:5}
    max-payload-bytes: ${OUTBOX_MAX_PAYLOAD_BYTES:65536}
  inbound:
    enabled: ${FAKE_INBOUND_ENABLED:false}
    fake-webhook-secret: ${FAKE_INBOUND_WEBHOOK_SECRET:}
    signature-window: ${FAKE_INBOUND_SIGNATURE_WINDOW:5m}
    max-payload-bytes: ${FAKE_INBOUND_MAX_PAYLOAD_BYTES:32768}
    requests-per-minute: ${FAKE_INBOUND_REQUESTS_PER_MINUTE:60}

logging:
  structured:
    format:
      console: logstash
