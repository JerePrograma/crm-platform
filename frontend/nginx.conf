# Only the socket peers explicitly allowed in this operator-owned file may
# supply forwarding headers. The image ships an empty allowlist.
geo $remote_addr $crm_trusted_edge {
  default 0;
  include /etc/nginx/crm-trusted-edge.conf;
}

map "$crm_trusted_edge:$http_x_forwarded_proto" $crm_forwarded_proto {
  default $scheme;
  "1:https" https;
  "1:http" http;
}

map $crm_trusted_edge $crm_forwarded_for {
  default $remote_addr;
  1 $proxy_add_x_forwarded_for;
}

map $crm_forwarded_proto $crm_hsts {
  default "";
  https "max-age=31536000";
}

map $uri $crm_log_path {
  default $uri;
  ~^/api/v1/unsubscribe/ "/api/v1/unsubscribe/[redacted]";
}

# Exclude query strings, bodies, cookies and unsubscribe tokens from access logs.
log_format crm '$remote_addr $request_method $crm_log_path $status $body_bytes_sent $request_time';

server {
  listen 8080;
  server_name _;
  server_tokens off;
  access_log /dev/stdout crm;
  client_max_body_size 11m;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security $crm_hsts always;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $crm_forwarded_proto;
    proxy_set_header X-Forwarded-For $crm_forwarded_for;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";
  }

  location /actuator/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $crm_forwarded_proto;
    proxy_set_header X-Forwarded-For $crm_forwarded_for;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
